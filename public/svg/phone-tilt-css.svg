<svg xmlns="http://www.w3.org/2000/svg" width="592" height="960" viewBox="-48 -80 592 960" role="img" aria-labelledby="title desc">
  <title id="title">Наклон телефона в четырёх направлениях</title>
  <desc id="desc">Белая иконка телефона последовательно наклоняется влево, вправо, верхней и нижней частью</desc>
  <style>
    :root { --phone-color: #fff; }

    .phone {
      fill: var(--phone-color, #fff);
      transform-box: fill-box;
      transform-origin: center;
      will-change: transform;
      animation: phone-tilt 5.8s cubic-bezier(.45, 0, .55, 1) infinite;
    }

    @keyframes phone-tilt {
      0%, 10%   { transform: translate(0, 0) rotate(0deg); }
      18%        { transform: translate(-5px, 0) rotate(-9deg); }
      27%        { transform: translate(0, 0) rotate(0deg); }
      35%        { transform: translate(5px, 0) rotate(9deg); }
      44%        { transform: translate(0, 0) rotate(0deg); }
      52%        { transform: translate(0, -5px) rotate(5deg); }
      61%        { transform: translate(0, 0) rotate(0deg); }
      69%        { transform: translate(0, 5px) rotate(-5deg); }
      78%, 100% { transform: translate(0, 0) rotate(0deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      .phone { animation: none; }
    }
  </style>

  <path class="phone" fill-rule="evenodd" d="
    M108 0h280c60 0 108 48 108 108v584c0 60-48 108-108 108H108C48 800 0 752 0 692V108C0 48 48 0 108 0Zm78 74a14 14 0 0 0 0 28h124a14 14 0 0 0 0-28H186Zm62 622a30 30 0 1 0 0 60 30 30 0 0 0 0-60Z
  "/>
</svg>
